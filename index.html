<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="divStyle.css">
    <title>Document</title>
</head>

<body>
    <section class="card">
        <div class="card_img">
            <img src="js.jpg" alt="JavaScript 入門">
        </div>

        <div class="card_body">
            <p class="card_price">NT$3800</p>
            <button class="card_btn_cart">加入購物車</button>
            <button class="card_btn_buy">直接購買</button>

            <div class="card_subtitle">
                <p>此課程包含</p>
                <ul>
                    <li>終身存取權</li>
                    <li>行動裝置隨時學習</li>
                    <li>9.9 小時課程內容</li>
                    <li>完課證書</li>
                </ul>
            </div>
        </div>

        <footer class="card_footer">
            公司同事一起學更划算！<a href="#" class="card_footer_link">歡迎洽詢企業方案</a>
        </footer>

    </section>
</body>

</html>
